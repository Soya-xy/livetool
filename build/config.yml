dev_mode:
  root_path: .
  log_level: warn
  debounce: 700
  ignore:
    dir:
      - .git
      - frontend/node_modules
      - frontend/dist
      - frontend/bindings
      - backend/node_modules
      - bin
      - build/bin
      - out
    file:
      - .DS_Store
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25 generate bindings -ts -i -d frontend/bindings
      type: once
    - cmd: npm --prefix frontend ci
      type: once
    - cmd: npm --prefix frontend run dev -- --host 127.0.0.1
      type: background
    - cmd: npm --prefix frontend run build
      type: blocking
    # Wails otherwise leaves WKWebView opaque over a transparent NSWindow.
    - cmd: go run -tags private_mac_apis .
      type: primary
